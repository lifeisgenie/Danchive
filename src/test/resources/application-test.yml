spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/danchive?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USER:danchive}
    password: ${DB_PASSWORD:<REMOVED_DB_PASSWORD>}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 30MB

jwt:
  secret: <REMOVED_JWT_SECRET>
  access-exp-minutes: 30
  refresh-exp-days: 7

app:
  upload-dir: uploads-test

firebase:
  credentials:
    path: ${FIREBASE_CREDENTIALS_PATH:}