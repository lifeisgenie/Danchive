spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/danchive?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USER:danchive}
    password: ${DB_PASSWORD:danchive-password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

