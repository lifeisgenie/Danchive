spring.application.name=Danchive

spring.datasource.url=jdbc:mysql://localhost:3306/danchive?serverTimezone=Asia/Seoul
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=change-this-to-a-very-long-random-secret-at-least-64-bytes
jwt.access-exp-minutes=30
jwt.refresh-exp-days=7