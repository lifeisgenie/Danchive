spring.application.name=Danchive

spring.datasource.url=jdbc:mysql://localhost:3306/danchive?serverTimezone=Asia/Seoul
spring.datasource.username=root
spring.datasource.password=<REMOVED_DB_PASSWORD>
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=<REMOVED_JWT_SECRET>
jwt.access-exp-minutes=30
jwt.refresh-exp-days=7

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=30MB
app.upload-dir=uploads