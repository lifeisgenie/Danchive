spring.config.activate.on-profile=prod

spring.datasource.url=jdbc:mysql://localhost:3306/danchive?serverTimezone=Asia/Seoul
spring.datasource.username=danchive
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET}
jwt.access-exp-minutes=30
jwt.refresh-exp-days=7

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=30MB
app.upload-dir=uploads

firebase.credentials.path=/firebase/danchive-firebase-adminsdk-fbsvc-0e59eb133e.json